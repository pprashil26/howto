<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102a43"><title>Life How-To</title>
<style>
:root{--navy:#102a43;--navy2:#183b56;--blue:#2f6f9f;--bg:#eef3f7;--card:#fff;--line:#d9e2ec;--muted:#627d98;--text:#243b53;--soft:#f5f8fa;--red:#c94a4a;--redbg:#fde2e2;--amber:#a46200;--amberbg:#fff3cd;--green:#257a4b;--greenbg:#dcf3e6;--radius:12px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.42 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}.app{max-width:860px;margin:auto;min-height:100vh;background:#f8fafc;box-shadow:0 0 28px #102a4318}.top{position:sticky;top:0;z-index:20;background:var(--navy);color:white;padding:max(10px,env(safe-area-inset-top)) 12px 10px}.toprow{display:flex;align-items:center;gap:8px}.brand{font-weight:800;letter-spacing:.08em;flex:1}.iconbtn,.primary,.ghost,.danger{border:0;border-radius:9px;min-height:40px;padding:8px 12px;font-weight:700}.iconbtn{background:#ffffff18;color:#fff;min-width:40px}.primary{background:var(--navy);color:#fff}.ghost{background:var(--soft);border:1px solid var(--line)}.danger{background:var(--redbg);color:#8d2929}.tools{display:grid;grid-template-columns:1fr auto auto;gap:7px;margin-top:9px}.search{width:100%;border:0;border-radius:9px;padding:9px 11px;min-height:40px}.content{padding:12px 12px 80px}.summarybar{display:flex;gap:8px;align-items:center;margin-bottom:9px}.count{font-size:12px;color:var(--muted);flex:1}.chips{display:flex;gap:6px;overflow:auto;padding:2px 0 8px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:12px}.chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}.list{display:grid;gap:8px}.card{background:var(--card);border:1px solid var(--line);border-left:4px solid transparent;border-radius:var(--radius);padding:11px;cursor:pointer}.card:hover{border-color:#9fb3c8}.card.critical{background:var(--redbg);border-left-color:var(--red)}.ctop{display:flex;gap:8px;align-items:start}.ctitle{font-weight:800;letter-spacing:.018em;flex:1}.meta,.foot,.hint{font-size:11px;color:var(--muted)}.summary{margin:4px 0 7px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.foot{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-flex;border-radius:999px;padding:2px 7px;font-size:10px;font-weight:800;background:#e8eef4;color:#486581}.pill.red{background:var(--redbg);color:#922}.pill.amber{background:var(--amberbg);color:var(--amber)}.pill.green{background:var(--greenbg);color:var(--green)}.empty{text-align:center;padding:54px 20px;color:var(--muted)}
.view{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px}.view h1{font-size:22px;margin:0 0 4px}.viewsummary{color:#486581;margin:10px 0 16px}.block{margin:13px 0}.block h2{font-size:15px;margin:0 0 5px;color:var(--navy)}.block p{white-space:pre-wrap;margin:0}.block.note,.block.warning{padding:10px;border-radius:9px}.block.note{background:#eaf4fb;border-left:4px solid var(--blue)}.block.warning{background:var(--redbg);border-left:4px solid var(--red)}.block ul,.block ol{padding-left:22px;margin:5px 0}.checkrow{display:flex;gap:8px;align-items:flex-start;margin:5px 0}.links a{font-weight:750;color:#1769aa;text-decoration:none}.linkitem{border-top:1px solid var(--line);padding:8px 0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.section{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.sectiontitle{font-weight:800;color:var(--navy);font-size:12px;letter-spacing:.06em;margin-bottom:8px}
.overlay{position:fixed;inset:0;background:#102a4388;z-index:50;display:flex;align-items:flex-end;justify-content:center}.modal{width:min(760px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:16px 16px 0 0;padding:15px 15px calc(15px + env(safe-area-inset-bottom))}.modal h2{margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:4px;margin-bottom:10px}.field label{font-size:11px;font-weight:800;color:#486581}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px;min-height:40px}.field textarea{min-height:76px;resize:vertical}.full{grid-column:1/-1}.switchrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:4px 0 12px}.editorblock{border:1px solid var(--line);border-radius:10px;padding:9px;margin:8px 0;background:#fbfdff}.ebar{display:flex;gap:5px;align-items:center;margin-bottom:6px}.etype{font-weight:800;font-size:11px;color:var(--navy);flex:1}.mini{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 8px}.itemrow{display:grid;grid-template-columns:1fr auto;gap:5px;margin:5px 0}.addmenu{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;background:#102a43;color:#fff;border-radius:9px;padding:9px 13px;font-size:12px;box-shadow:0 7px 25px #0003}.hidden{display:none!important}.menu{display:grid;gap:7px}.divider{height:1px;background:var(--line);margin:5px 0}.statusline{font-size:12px;padding:8px;border-radius:8px;background:var(--soft);margin-bottom:8px}.filtergrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filtergrid label{display:flex;gap:7px;align-items:center}.row{display:flex;gap:7px;align-items:center}.row>*:first-child{flex:1}
@media(max-width:600px){.grid,.filtergrid{grid-template-columns:1fr}.modal{padding:13px}.content{padding:10px 9px 72px}.tools{grid-template-columns:1fr auto auto}.hideMobile{display:none}.view{border-radius:8px;padding:13px}}
</style></head>
<body><div class="app"><header class="top"><div class="toprow"><div class="brand">LIFE HOW-TO</div><button class="iconbtn" id="addBtn" aria-label="Add How-To">＋</button><button class="iconbtn" id="menuBtn" aria-label="Menu">⋮</button></div><div class="tools"><input class="search" id="search" placeholder="Search how-tos..."><button class="iconbtn" id="filterBtn">FILTER</button><button class="iconbtn" id="sortBtn">SORT</button></div></header><main class="content" id="main"></main></div><div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
'use strict';
const APP='life-how-to',APP_VERSION='1.0',FORMAT=1,DB_NAME='LifeHowToDB',DB_VERSION=1,MAX_SNAPSHOTS=20;
const BLOCK_TYPES=['heading','text','long-text','bullets','numbered','checklist','note','warning'];
const STARTERS=['Home','Technology','Garden','Cooking','Maintenance','Travel','Life Admin','Work Reference','Other'];
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=()=>crypto.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);const now=()=>new Date().toISOString();const today=()=>new Date().toLocaleDateString('en-CA');
let db,state={howtos:[],categories:[],settings:{sort:'updated-desc',search:'',filters:[],showArchived:false,dataRevision:0,lastBackupAt:null,changesSinceBackup:0,dueSoonDays:30},current:null};
function toast(t){const x=$('#toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),1800)}
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('howtos')){let s=d.createObjectStore('howtos',{keyPath:'id'});['title','categoryId','status','updatedAt','createdAt','reviewDate','approvedDate','archived','critical','favourite'].forEach(i=>s.createIndex(i,i))}if(!d.objectStoreNames.contains('categories')){let s=d.createObjectStore('categories',{keyPath:'id'});s.createIndex('name','name',{unique:true})}if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'key'});if(!d.objectStoreNames.contains('snapshots')){let s=d.createObjectStore('snapshots',{keyPath:'id'});s.createIndex('createdAt','createdAt')}};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function all(store){return new Promise((res,rej)=>{let r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(store,obj){return new Promise((res,rej)=>{let tx=db.transaction(store,'readwrite');tx.objectStore(store).put(obj);tx.oncomplete=()=>res(obj);tx.onerror=()=>rej(tx.error)})}
function del(store,id){return new Promise((res,rej)=>{let tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function load(){state.howtos=await all('howtos');state.categories=await all('categories');const sets=await all('settings');const u=sets.find(x=>x.key==='ui'),sys=sets.find(x=>x.key==='system');if(u)Object.assign(state.settings,u.value);if(sys)Object.assign(state.settings,sys.value);if(!state.categories.length){for(const name of STARTERS)await put('categories',{id:uid(),name,colour:null,createdAt:now(),updatedAt:now()});state.categories=await all('categories')}$('#search').value=state.settings.search||'';render()}
async function saveSettings(){await put('settings',{key:'ui',value:{sort:state.settings.sort,search:state.settings.search,filters:state.settings.filters,showArchived:state.settings.showArchived,dueSoonDays:state.settings.dueSoonDays}});await put('settings',{key:'system',value:{dataRevision:state.settings.dataRevision,lastBackupAt:state.settings.lastBackupAt,changesSinceBackup:state.settings.changesSinceBackup}})}
async function mutation(){state.settings.dataRevision++;state.settings.changesSinceBackup++;await saveSettings();await mirror()}
async function saveHowto(h){await put('howtos',h);const check=(await all('howtos')).find(x=>x.id===h.id);if(!check||check.updatedAt!==h.updatedAt)throw Error('Save not verified');state.howtos=await all('howtos');await mutation();render();toast('Saved and verified')}
function catName(id){return state.categories.find(c=>c.id===id)?.name||'Uncategorised'}
function blockText(b){return b.text||((b.items||[]).map(i=>i.text).join(' '))}
function searchText(h){return [h.title,h.summary,catName(h.categoryId),...(h.tags||[]),...(h.blocks||[]).map(blockText),...(h.links||[]).flatMap(l=>[l.label,l.url,l.description])].join(' ').toLowerCase().normalize('NFKD')}
function reviewState(h){if(!h.reviewDate)return 'none';let d=new Date(h.reviewDate+'T00:00:00'),t=new Date(today()+'T00:00:00'),days=Math.round((d-t)/864e5);return days<0?'due':days<=state.settings.dueSoonDays?'soon':'current'}
function approval(h){return h.approvalStatus==='approved'&&h.approvedRevision===h.contentRevision?'approved':h.approvedDate?'review-required':'not-approved'}
function filtered(){let q=(state.settings.search||'').trim().toLowerCase(),a=state.howtos.filter(h=>state.settings.showArchived?!!h.archived:!h.archived);if(q)a=a.filter(h=>searchText(h).includes(q));for(const f of state.settings.filters||[]){if(f==='review-due')a=a.filter(h=>reviewState(h)==='due');else if(f==='due-soon')a=a.filter(h=>reviewState(h)==='soon');else if(f==='approved')a=a.filter(h=>approval(h)==='approved');else if(f==='review-required')a=a.filter(h=>approval(h)==='review-required');else if(f==='critical')a=a.filter(h=>h.critical);else if(f==='favourite')a=a.filter(h=>h.favourite);else if(f==='has-checklist')a=a.filter(h=>h.blocks?.some(b=>b.type==='checklist'));else if(f==='has-links')a=a.filter(h=>h.links?.length);else if(['draft','ready','needs-review'].includes(f))a=a.filter(h=>h.status===f);else if(f.startsWith('cat:'))a=a.filter(h=>h.categoryId===f.slice(4))}const s=state.settings.sort;a.sort((x,y)=>s==='created-desc'?y.createdAt.localeCompare(x.createdAt):s==='title-asc'?x.title.localeCompare(y.title):s==='title-desc'?y.title.localeCompare(x.title):s==='review-asc'?(x.reviewDate||'9999').localeCompare(y.reviewDate||'9999'):s==='category'?catName(x.categoryId).localeCompare(catName(y.categoryId)):y.updatedAt.localeCompare(x.updatedAt));return a}
function render(){const a=filtered(),total=state.howtos.filter(h=>state.settings.showArchived?!!h.archived:!h.archived).length;$('#main').innerHTML=`<div class="chips"><button class="chip ${!state.settings.filters.length?'active':''}" onclick="clearFilters()">All</button>${['ready','draft','review-due'].map(f=>`<button class="chip ${state.settings.filters.includes(f)?'active':''}" onclick="toggleFilter('${f}')">${f.replaceAll('-',' ')}</button>`).join('')}</div><div class="summarybar"><div class="count">${a.length===total?a.length:a.length+' of '+total} How-To${total===1?'':'s'}${state.settings.showArchived?' · Archive':''}</div>${state.settings.filters.length?'<button class="mini" onclick="clearFilters()">Clear filters</button>':''}</div><div class="list">${a.map(card).join('')||`<div class="empty"><b>No matching How-Tos</b><p>Capture a process you want to remember and reuse.</p><button class="primary" onclick="newHowto()">CREATE HOW-TO</button></div>`}</div>`}
function card(h){let r=reviewState(h),ap=approval(h);return `<article class="card ${h.critical?'critical':''}" onclick="viewHowto('${h.id}')"><div class="ctop"><div class="ctitle">${esc(h.title||'UNTITLED HOW-TO')}</div>${h.favourite?'<span>★</span>':''}</div><div class="meta">${esc(catName(h.categoryId))} · ${esc(h.status.replace('-',' '))}</div>${h.summary?`<div class="summary">${esc(h.summary)}</div>`:''}<div class="foot">${r==='due'?'<span class="pill red">REVIEW DUE</span>':r==='soon'?'<span class="pill amber">DUE SOON</span>':h.reviewDate?`<span>Review ${esc(h.reviewDate)}</span>`:''}${ap==='approved'?'<span class="pill green">APPROVED</span>':ap==='review-required'?'<span class="pill amber">REVIEW REQUIRED</span>':''}${h.links?.length?`<span>${h.links.length} link${h.links.length>1?'s':''}</span>`:''}</div></article>`}
function showModal(body){$('#modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${body}</div></div>`}function closeModal(){$('#modalRoot').innerHTML=''}
function newHowto(){editHowto(null)}
function blank(){return{id:uid(),title:'',summary:'',categoryId:state.categories[0]?.id||null,tags:[],status:'draft',critical:false,favourite:false,archived:false,blocks:[],links:[],lastReviewedDate:null,reviewDate:null,approvalStatus:'not-approved',approvedDate:null,approvedRevision:null,contentRevision:1,createdAt:now(),updatedAt:now(),archivedAt:null}}
function editHowto(id){const src=id?state.howtos.find(x=>x.id===id):blank();state.current=structuredClone(src);showEditor()}
function showEditor(){let h=state.current;showModal(`<div class="row"><h2>${state.howtos.some(x=>x.id===h.id)?'EDIT':'NEW'} HOW-TO</h2><button class="mini" onclick="closeModal()">✕</button></div><form id="editor" onsubmit="event.preventDefault();commitEditor()"><div class="grid"><div class="field full"><label>TITLE</label><input id="eTitle" value="${esc(h.title)}" required></div><div class="field full"><label>SUMMARY</label><textarea id="eSummary">${esc(h.summary)}</textarea></div><div class="field"><label>CATEGORY</label><select id="eCategory">${state.categories.map(c=>`<option value="${c.id}" ${c.id===h.categoryId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>STATUS</label><select id="eStatus">${['draft','ready','needs-review'].map(x=>`<option ${x===h.status?'selected':''} value="${x}">${x.replace('-',' ')}</option>`).join('')}</select></div><div class="field full"><label>TAGS · COMMA SEPARATED</label><input id="eTags" value="${esc((h.tags||[]).join(', '))}"></div></div><div class="switchrow"><label><input type="checkbox" id="eCritical" ${h.critical?'checked':''}> Critical</label><label><input type="checkbox" id="eFavourite" ${h.favourite?'checked':''}> Favourite</label></div><div class="section"><div class="sectiontitle">CONTENT</div><div id="blocks">${(h.blocks||[]).map((b,i)=>blockEditor(b,i)).join('')}</div><button type="button" class="ghost" onclick="chooseBlock()">＋ Add block</button></div><div class="section"><div class="sectiontitle">LINKS</div><div id="linksEditor">${(h.links||[]).map((l,i)=>linkEditor(l,i)).join('')}</div><button type="button" class="ghost" onclick="addLink()">＋ Add link</button></div><div class="section"><div class="sectiontitle">REVIEW & APPROVAL</div><div class="grid"><div class="field"><label>LAST REVIEWED</label><input id="eLastReviewed" type="date" value="${h.lastReviewedDate||''}"></div><div class="field"><label>NEXT REVIEW</label><input id="eReview" type="date" value="${h.reviewDate||''}"></div></div><div class="statusline">Approval: <b>${approval(h).replace('-',' ')}</b> · Content revision ${h.contentRevision}</div></div><div class="actions"><button class="primary" type="submit">SAVE</button><button class="ghost" type="button" onclick="closeModal()">CANCEL</button></div></form>`)}
function blockEditor(b,i){let body;if(['heading','text','long-text','note','warning'].includes(b.type))body=`<textarea data-blocktext="${i}">${esc(b.text)}</textarea>`;else body=(b.items||[]).map((it,j)=>`<div class="itemrow"><input data-item="${i}:${j}" value="${esc(it.text)}"><button type="button" class="mini" onclick="removeItem(${i},${j})">✕</button></div>`).join('')+`<button type="button" class="mini" onclick="addItem(${i})">＋ item</button>`;return `<div class="editorblock"><div class="ebar"><span class="etype">${b.type.toUpperCase()}</span><button type="button" class="mini" onclick="moveBlock(${i},-1)">↑</button><button type="button" class="mini" onclick="moveBlock(${i},1)">↓</button><button type="button" class="mini" onclick="duplicateBlock(${i})">⧉</button><button type="button" class="mini" onclick="removeBlock(${i})">✕</button></div>${body}</div>`}
function syncEditor(){if(!state.current)return;state.current.title=$('#eTitle')?.value??state.current.title;state.current.summary=$('#eSummary')?.value??state.current.summary;state.current.categoryId=$('#eCategory')?.value??state.current.categoryId;state.current.status=$('#eStatus')?.value??state.current.status;state.current.tags=($('#eTags')?.value||'').split(',').map(x=>x.trim()).filter(Boolean);state.current.critical=!!$('#eCritical')?.checked;state.current.favourite=!!$('#eFavourite')?.checked;state.current.lastReviewedDate=$('#eLastReviewed')?.value||null;state.current.reviewDate=$('#eReview')?.value||null;document.querySelectorAll('[data-blocktext]').forEach(x=>state.current.blocks[+x.dataset.blocktext].text=x.value);document.querySelectorAll('[data-item]').forEach(x=>{let[i,j]=x.dataset.item.split(':').map(Number);if(state.current.blocks[i]?.items[j])state.current.blocks[i].items[j].text=x.value});document.querySelectorAll('[data-linkfield]').forEach(x=>{let[i,k]=x.dataset.linkfield.split(':');state.current.links[+i][k]=x.value})}
function chooseBlock(){syncEditor();showModal(`<h2>ADD CONTENT</h2><div class="addmenu">${BLOCK_TYPES.map(t=>`<button class="ghost" onclick="createBlock('${t}')">${t.replace('-',' ')}</button>`).join('')}</div><div class="actions"><button class="ghost" onclick="showEditor()">Cancel</button></div>`)}
function createBlock(type){let b={id:uid(),type};if(['bullets','numbered','checklist'].includes(type))b.items=[{id:uid(),text:'',checked:false}];else b.text='';state.current.blocks.push(b);showEditor()}
function moveBlock(i,d){syncEditor();let j=i+d;if(j<0||j>=state.current.blocks.length)return;[state.current.blocks[i],state.current.blocks[j]]=[state.current.blocks[j],state.current.blocks[i]];showEditor()}
function duplicateBlock(i){syncEditor();let b=structuredClone(state.current.blocks[i]);b.id=uid();(b.items||[]).forEach(x=>x.id=uid());state.current.blocks.splice(i+1,0,b);showEditor()}
function removeBlock(i){syncEditor();state.current.blocks.splice(i,1);showEditor()}function addItem(i){syncEditor();state.current.blocks[i].items.push({id:uid(),text:'',checked:false});showEditor()}function removeItem(i,j){syncEditor();state.current.blocks[i].items.splice(j,1);showEditor()}
function linkEditor(l,i){return `<div class="editorblock"><div class="ebar"><span class="etype">LINK</span><button type="button" class="mini" onclick="removeLink(${i})">✕</button></div><div class="grid"><div class="field"><label>LABEL</label><input data-linkfield="${i}:label" value="${esc(l.label)}"></div><div class="field"><label>TYPE</label><select data-linkfield="${i}:type">${['reference','documentation','video','product','tool','download','other'].map(x=>`<option ${x===l.type?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><label>URL</label><input data-linkfield="${i}:url" value="${esc(l.url)}"></div><div class="field full"><label>DESCRIPTION</label><input data-linkfield="${i}:description" value="${esc(l.description)}"></div></div></div>`}
function addLink(){syncEditor();state.current.links.push({id:uid(),label:'',url:'',description:'',type:'reference'});showEditor()}function removeLink(i){syncEditor();state.current.links.splice(i,1);showEditor()}
function material(h){return JSON.stringify({title:h.title,summary:h.summary,categoryId:h.categoryId,tags:h.tags,status:h.status,blocks:h.blocks.map(b=>({...b,items:b.items?.map(i=>({id:i.id,text:i.text}))})),links:h.links})}
async function commitEditor(){syncEditor();if(!state.current.title.trim())return toast('Title is required');for(const l of state.current.links){if(l.url&&!safeUrl(l.url))return toast('Only http and https links are allowed')}const old=state.howtos.find(x=>x.id===state.current.id);if(old&&material(old)!==material(state.current)){state.current.contentRevision=(old.contentRevision||1)+1;if(old.approvalStatus==='approved')state.current.approvalStatus='review-required'}state.current.updatedAt=now();closeModal();await saveHowto(state.current)}
function safeUrl(u){try{return['http:','https:'].includes(new URL(u).protocol)}catch{return false}}
function viewHowto(id){let h=state.howtos.find(x=>x.id===id);state.current=h;let blocks=(h.blocks||[]).map(b=>renderBlock(h,b)).join('');showModal(`<div class="view"><div class="row"><div><h1>${esc(h.title)}</h1><div class="meta">${esc(catName(h.categoryId))} · ${esc(h.status.replace('-',' '))}</div></div><button class="mini" onclick="closeModal()">✕</button></div>${h.summary?`<div class="viewsummary">${esc(h.summary)}</div>`:''}<div>${blocks||'<div class="hint">No process content yet.</div>'}</div>${h.links?.length?`<div class="section links"><div class="sectiontitle">REFERENCES</div>${h.links.map(l=>`<div class="linkitem"><a href="${safeUrl(l.url)?esc(l.url):'#'}" target="_blank" rel="noopener noreferrer">${esc(l.label||l.url)}</a><div class="hint">${esc((()=>{try{return new URL(l.url).hostname}catch{return l.url}})())}</div>${l.description?`<div>${esc(l.description)}</div>`:''}</div>`).join('')}</div>`:''}<div class="section"><div class="sectiontitle">REVIEW & APPROVAL</div><div class="foot"><span>${h.lastReviewedDate?'Reviewed '+esc(h.lastReviewedDate):'Not reviewed'}</span><span>${h.reviewDate?'Next '+esc(h.reviewDate):'No next review'}</span><span class="pill ${approval(h)==='approved'?'green':'amber'}">${approval(h).replace('-',' ')}</span></div></div><div class="actions"><button class="primary" onclick="editHowto('${h.id}')">EDIT</button><button class="ghost" onclick="markReviewed('${h.id}')">MARK REVIEWED</button>${approval(h)!=='approved'?`<button class="ghost" onclick="approve('${h.id}')">APPROVE</button>`:''}<button class="ghost" onclick="duplicateHowto('${h.id}')">DUPLICATE</button><button class="ghost" onclick="archiveHowto('${h.id}')">${h.archived?'RESTORE':'ARCHIVE'}</button><button class="danger" onclick="deleteHowto('${h.id}')">DELETE</button></div></div>`)}
function renderBlock(h,b){if(b.type==='heading')return `<div class="block"><h2>${esc(b.text)}</h2></div>`;if(['text','long-text'].includes(b.type))return `<div class="block"><p>${linkify(b.text)}</p></div>`;if(['note','warning'].includes(b.type))return `<div class="block ${b.type}"><b>${b.type.toUpperCase()}</b><p>${linkify(b.text)}</p></div>`;if(['bullets','numbered'].includes(b.type)){let tag=b.type==='numbered'?'ol':'ul';return `<div class="block"><${tag}>${(b.items||[]).map(i=>`<li>${linkify(i.text)}</li>`).join('')}</${tag}></div>`}if(b.type==='checklist')return `<div class="block">${(b.items||[]).map(i=>`<label class="checkrow"><input type="checkbox" ${i.checked?'checked':''} onchange="toggleCheck('${h.id}','${b.id}','${i.id}',this.checked)"><span>${linkify(i.text)}</span></label>`).join('')}</div>`;return ''}
function linkify(t){let s=esc(t||'');return s.replace(/https?:\/\/[^\s<]+/g,u=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`)}
async function toggleCheck(hid,bid,iid,val){let h=structuredClone(state.howtos.find(x=>x.id===hid)),b=h.blocks.find(x=>x.id===bid),it=b.items.find(x=>x.id===iid);it.checked=val;h.updatedAt=now();await saveHowto(h);viewHowto(hid)}
async function markReviewed(id){let h=structuredClone(state.howtos.find(x=>x.id===id));let next=prompt('Next review date (YYYY-MM-DD), blank for none:',h.reviewDate||'');if(next===null)return;h.lastReviewedDate=today();h.reviewDate=next||null;h.updatedAt=now();closeModal();await saveHowto(h)}
async function approve(id){let h=structuredClone(state.howtos.find(x=>x.id===id));h.approvalStatus='approved';h.approvedDate=today();h.approvedRevision=h.contentRevision;h.updatedAt=now();closeModal();await saveHowto(h)}
async function archiveHowto(id){let h=structuredClone(state.howtos.find(x=>x.id===id));h.archived=!h.archived;h.archivedAt=h.archived?now():null;h.updatedAt=now();closeModal();await saveHowto(h)}
async function deleteHowto(id){if(!confirm('Permanently delete this How-To? A recovery snapshot will be created first.'))return;await createSnapshot('pre-bulk-delete');await del('howtos',id);state.howtos=await all('howtos');await mutation();closeModal();render();toast('Deleted')}
async function duplicateHowto(id){let h=structuredClone(state.howtos.find(x=>x.id===id));h.id=uid();h.title+=' COPY';h.blocks.forEach(b=>{b.id=uid();(b.items||[]).forEach(i=>i.id=uid())});h.links.forEach(l=>l.id=uid());h.createdAt=h.updatedAt=now();h.approvalStatus='not-approved';h.approvedDate=null;h.approvedRevision=null;closeModal();await saveHowto(h)}
function toggleFilter(f){let a=state.settings.filters,i=a.indexOf(f);i>=0?a.splice(i,1):a.push(f);saveSettings();render()}function clearFilters(){state.settings.filters=[];saveSettings();render()}
function filterSheet(){const opts=['draft','ready','needs-review','review-due','due-soon','approved','review-required','critical','favourite','has-checklist','has-links'];showModal(`<h2>FILTER</h2><div class="filtergrid">${opts.map(x=>`<label><input type="checkbox" ${state.settings.filters.includes(x)?'checked':''} onchange="toggleFilter('${x}');filterSheet()"> ${x.replaceAll('-',' ')}</label>`).join('')}${state.categories.map(c=>`<label><input type="checkbox" ${state.settings.filters.includes('cat:'+c.id)?'checked':''} onchange="toggleFilter('cat:${c.id}');filterSheet()"> ${esc(c.name)}</label>`).join('')}</div><div class="actions"><button class="primary" onclick="closeModal()">DONE</button><button class="ghost" onclick="clearFilters();filterSheet()">CLEAR</button></div>`)}
function sortSheet(){const a=[['updated-desc','Recently updated'],['created-desc','Recently created'],['title-asc','Title A-Z'],['title-desc','Title Z-A'],['review-asc','Review date'],['category','Category']];showModal(`<h2>SORT</h2><div class="menu">${a.map(x=>`<button class="ghost" onclick="setSort('${x[0]}')">${x[1]} ${state.settings.sort===x[0]?'✓':''}</button>`).join('')}</div>`)}function setSort(s){state.settings.sort=s;saveSettings();closeModal();render()}
async function canonical(data){return JSON.stringify(data,Object.keys(data).sort())}async function hashText(s){let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function payload(){return{app:APP,formatVersion:FORMAT,appVersion:APP_VERSION,exportedAt:now(),dataRevision:state.settings.dataRevision,counts:{howtos:state.howtos.length,categories:state.categories.length},data:{howtos:state.howtos,categories:state.categories,settings:[{key:'ui',value:state.settings}]}}}
async function checksumPayload(p){return hashText(JSON.stringify(p))}
async function mirror(){try{let p=await payload();localStorage.setItem('life-how-to-mirror',JSON.stringify({...p,checksum:await checksumPayload(p)}))}catch(e){console.warn('Mirror unavailable',e)}}
async function downloadBackup(){let p=await payload(),out={...p,checksum:await checksumPayload(p)},blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`life-how-to-backup-${today()}.json`;a.click();URL.revokeObjectURL(a.href);state.settings.lastBackupAt=now();state.settings.changesSinceBackup=0;await saveSettings();toast('Backup downloaded')}
async function restoreFile(inp){let f=inp.files[0];if(!f)return;try{let o=JSON.parse(await f.text()),{checksum,...p}=o;if(o.app!==APP||o.formatVersion!==FORMAT)throw Error('Unsupported backup format');if(await checksumPayload(p)!==checksum)throw Error('Checksum verification failed');if(!Array.isArray(o.data?.howtos)||!Array.isArray(o.data?.categories))throw Error('Invalid backup data');if(!confirm(`Verified backup: ${o.data.howtos.length} How-Tos. Replace current data?`))return;await createSnapshot('pre-restore');for(const h of state.howtos)await del('howtos',h.id);for(const c of state.categories)await del('categories',c.id);for(const h of o.data.howtos)await put('howtos',normalizeHowto(h));for(const c of o.data.categories)await put('categories',c);await load();await createSnapshot('post-restore');closeModal();toast('Restore completed and verified')}catch(e){alert('Restore failed: '+e.message)}}
function normalizeHowto(h){let x=Object.assign(blank(),h);x.blocks=(x.blocks||[]).filter(b=>BLOCK_TYPES.includes(b.type));x.links=(x.links||[]).filter(l=>!l.url||safeUrl(l.url));return x}
async function createSnapshot(reason='manual'){let p=await payload(),s={id:uid(),createdAt:now(),reason,appVersion:APP_VERSION,formatVersion:FORMAT,revision:state.settings.dataRevision,counts:p.counts,data:p.data,checksum:await checksumPayload(p)};await put('snapshots',s);let ss=(await all('snapshots')).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));for(const old of ss.slice(MAX_SNAPSHOTS))await del('snapshots',old.id);toast('Recovery snapshot created')}
async function recovery(){let ss=(await all('snapshots')).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));showModal(`<h2>RECOVERY CENTER</h2><div class="hint">Up to ${MAX_SNAPSHOTS} verified local snapshots.</div><div class="list">${ss.map(s=>`<div class="card"><b>${new Date(s.createdAt).toLocaleString()}</b><div class="meta">${esc(s.reason)} · ${s.counts.howtos} How-Tos · Revision ${s.revision}</div><div class="actions"><button class="mini" onclick="restoreSnapshot('${s.id}')">RESTORE</button><button class="mini" onclick="deleteSnapshot('${s.id}')">DELETE</button></div></div>`).join('')||'<div class="empty">No snapshots yet.</div>'}</div><div class="actions"><button class="primary" onclick="createSnapshot('manual');recovery()">CREATE SNAPSHOT</button><button class="ghost" onclick="closeModal()">CLOSE</button></div>`)}
async function restoreSnapshot(id){let s=(await all('snapshots')).find(x=>x.id===id);if(!s||!confirm(`Restore snapshot from ${new Date(s.createdAt).toLocaleString()}?`))return;await createSnapshot('pre-restore');for(const h of state.howtos)await del('howtos',h.id);for(const c of state.categories)await del('categories',c.id);for(const h of s.data.howtos)await put('howtos',normalizeHowto(h));for(const c of s.data.categories)await put('categories',c);await load();await createSnapshot('post-restore');closeModal();toast('Snapshot restored')}
async function deleteSnapshot(id){if(!confirm('Delete this recovery snapshot?'))return;await del('snapshots',id);recovery()}
function menu(){let recommend=state.settings.changesSinceBackup>=25||(!state.settings.lastBackupAt&&state.settings.changesSinceBackup>0);showModal(`<h2>MENU</h2>${recommend?`<div class="statusline">Backup recommended · ${state.settings.changesSinceBackup} changes since last backup</div>`:''}<div class="menu"><button class="ghost" onclick="downloadBackup()">DOWNLOAD BACKUP</button><label class="ghost" style="text-align:center">RESTORE BACKUP<input type="file" accept="application/json" hidden onchange="restoreFile(this)"></label><button class="ghost" onclick="recovery()">RECOVERY CENTER</button><button class="ghost" onclick="manageCategories()">MANAGE CATEGORIES</button><button class="ghost" onclick="state.settings.showArchived=!state.settings.showArchived;saveSettings();closeModal();render()">${state.settings.showArchived?'SHOW ACTIVE':'SHOW ARCHIVE'}</button><div class="divider"></div><div class="hint">Life How-To V${APP_VERSION} · Local-first<br>Revision ${state.settings.dataRevision} · ${state.howtos.length} How-Tos</div><button class="ghost" onclick="closeModal()">CLOSE</button></div>`)}
function manageCategories(){showModal(`<h2>CATEGORIES</h2><div class="list">${state.categories.map(c=>`<div class="row"><input id="cat-${c.id}" value="${esc(c.name)}"><button class="mini" onclick="renameCategory('${c.id}')">SAVE</button><button class="mini" onclick="deleteCategory('${c.id}')">✕</button></div>`).join('')}</div><div class="actions"><button class="primary" onclick="addCategory()">＋ ADD</button><button class="ghost" onclick="menu()">BACK</button></div>`)}
async function addCategory(){let name=prompt('Category name');if(!name)return;await put('categories',{id:uid(),name:name.trim(),colour:null,createdAt:now(),updatedAt:now()});state.categories=await all('categories');await mutation();manageCategories()}
async function renameCategory(id){let c=state.categories.find(x=>x.id===id),v=$('#cat-'+id).value.trim();if(!v)return;c={...c,name:v,updatedAt:now()};await put('categories',c);state.categories=await all('categories');await mutation();manageCategories()}
async function deleteCategory(id){if(state.howtos.some(h=>h.categoryId===id))return alert('Reassign How-Tos before deleting this category.');if(!confirm('Delete category?'))return;await del('categories',id);state.categories=await all('categories');await mutation();manageCategories()}
$('#addBtn').onclick=newHowto;$('#menuBtn').onclick=menu;$('#filterBtn').onclick=filterSheet;$('#sortBtn').onclick=sortSheet;$('#search').addEventListener('input',e=>{state.settings.search=e.target.value;saveSettings();render()});
(async()=>{try{db=await openDB();await load();await mirror()}catch(e){document.body.innerHTML='<div class="empty"><b>Life How-To could not start.</b><p>'+esc(e.message)+'</p></div>'}})();
</script></body></html>
